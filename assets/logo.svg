<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- 超级快捷键（SuperKey）图标的矢量母版。构造说明见同目录的 logo.md；坐标是 100×100 的单位坐标 -->
  <title>超级快捷键 SuperKey</title>
  <defs>
    <!-- 底板渐变：从上到下，浅蓝 → 深蓝 -->
    <linearGradient id="tile" x1="0" y1="6" x2="0" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B9AF3"/>
      <stop offset="1" stop-color="#0063B1"/>
    </linearGradient>
  </defs>
  <!-- 底板：圆角方形，四周各留 6 个单位的透明边 -->
  <rect x="6" y="6" width="88" height="88" rx="22" ry="22" fill="url(#tile)"/>
  <!-- 闪电：6 个顶点的多边形，再用宽 5.95（向外各扩 2.975）的圆角描边把拐角变圆 -->
  <polygon points="56.95,24.5 38.25,51.7 50.15,51.7 45.05,75.5 63.75,46.6 51.85,46.6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="5.95" stroke-linejoin="round"/>
</svg>
